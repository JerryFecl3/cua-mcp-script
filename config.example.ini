; Copy to config.ini, or launch run.cmd once to create it automatically.
; Edit config.ini only. Updates never overwrite that personal file.
; Values are unquoted. Put comments on their own lines, starting with ; or #.
[CuaLink]
; true: every setting below is required. false: all connection settings are prompted.
UseConfig=false

; Required in preset mode: 32-4096 non-whitespace characters.
; Interactive mode generates a fresh random token at start.
; Generate a token in Windows PowerShell 5.1 (paste the following TWO lines):
; $b = New-Object byte[] 32; $r = [Security.Cryptography.RandomNumberGenerator]::Create()
; $r.GetBytes($b); $r.Dispose(); [BitConverter]::ToString($b).Replace('-', '')
; This is a Bearer token, NOT an SSH login key. Keep config.ini private.
BearerToken=

; Linux SSH hostname/IP and username.
SshHost=
SshUser=

; key or password. Password mode prompts on every new start; never store passwords.
; Generate an SSH key: ssh-keygen -t ed25519
; Install the .pub public key in Linux ~/.ssh/authorized_keys. Keep the private key on Windows.
; Key mode uses OpenSSH identities/config/agent. Unlock encrypted keys in ssh-agent first.
SshAuthMode=key

; All ports must be integers from 1 to 65535.
SshPort=22
; Windows CUA HTTP port.
LocalPort=19222
; Port mapped onto the Linux SSH host's loopback interface.
RemotePort=19222
